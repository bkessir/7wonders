[build]
  command = "npm run build"
  publish = "dist"

# Firebase web API keys are intentionally public (security is enforced by
# Firebase database rules, not by keeping the key secret). Disable Netlify's
# smart secrets scanner so it doesn't block the build.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = "200"
